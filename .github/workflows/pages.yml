# Publishes the game to GitHub Pages: https://pyros-projects.github.io/roomwright/
#
# The site is two files, index.html and intro.mp4. Nothing is built here: index.html is committed,
# and one step only makes sure it matches src/. After the upload the last step fetches the live copy
# and compares it with the commit, so a green run means the new game is being served.
#
# Every version branch (v0.3, v0.4, ...) is published next to it under its own name, for example
# .../roomwright/v0.3/, for as long as the branch exists: the one being playtested and the ones already
# merged, so a version can be compared with those before it. A copy served from a version folder keeps
# its own save (see Save.KEY), so playing it never touches progress in the released game.
# A run uses the workflow file of the branch that was pushed. Branches from before this file listed every
# version (main until 0.4 is merged, and v0.3) still publish only main and v0.3 when they are pushed.
#
# Runs on a push to main or to a version branch that changes the game, or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'v*']
    paths:
      - index.html
      - intro.mp4
      - src/**
      - tools/build.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy finishes; of the ones waiting, only the newest runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The released game (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: live

      - name: Every version branch
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir versions
          # a version branch is v and a number with dots: v0.3, v0.4, v1; anything else that starts with v is not one
          # listed into a variable first: if the listing fails, the step fails, and the versions do not silently go offline
          heads="$(git ls-remote --heads "https://github.com/$REPO" 'v*')"
          while read -r sha ref; do
            name="${ref#refs/heads/}"
            if ! printf '%s' "$name" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then continue; fi
            git clone --quiet --depth 1 --branch "$name" "https://github.com/$REPO" "versions/$name"
            echo "$name at $sha"
          done <<< "$heads"

      - name: index.html matches src/
        run: |
          live/tools/build.sh --check
          for v in versions/*/; do if [ -d "$v" ]; then "${v}tools/build.sh" --check; fi; done

      - name: Collect the files
        run: |
          mkdir _site
          cp live/index.html live/intro.mp4 _site/
          for v in versions/*/; do
            [ -d "$v" ] || continue
            name="$(basename "$v")"; mkdir "_site/$name"; cp "${v}index.html" "${v}intro.mp4" "_site/$name/"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: The live copies are these commits' games
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}"
          same() {                          # same <folder of the checkout> <address>
            want="$(sha256sum "$1/index.html" | cut -d' ' -f1)"
            got=""
            for _ in $(seq 1 24); do        # the new copy can take a moment to reach the edge
              got="$(curl -fsSL "$2/index.html?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
              [ "$got" = "$want" ] && break
              sleep 5
            done
            if [ "$got" != "$want" ]; then echo "$2/index.html is not this commit's."; exit 1; fi
            size="$(curl -fsSL -o /dev/null -w '%{size_download}' "$2/intro.mp4?v=$GITHUB_SHA")"
            if [ "$size" != "$(wc -c < "$1/intro.mp4" | tr -d ' ')" ]; then echo "$2/intro.mp4 has $size bytes."; exit 1; fi
            echo "Live at $2/"
          }
          same live "$url"
          for v in versions/*/; do if [ -d "$v" ]; then same "${v%/}" "$url/$(basename "$v")"; fi; done
